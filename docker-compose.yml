services:

  # ---------------------------------------------------------------------------
  # Webhook
  # ---------------------------------------------------------------------------

  # Echo server — logs every incoming POST with headers and body.
  webhook:
    image: mendhak/http-https-echo:latest
    container_name: genx-webhook
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Run: docker compose --profile test-webhook up
  # genx sends 6 points (one every 5 s) to the echo server.
  # Watch: docker compose logs -f webhook
  test-webhook:
    build: .
    profiles: [test-webhook]
    depends_on:
      webhook:
        condition: service_healthy
    command: >
      --output webhook
      --webhook-url http://webhook:8080
      --webhook-token secret
      --type cos --duration 30s --step 5s --realtime

  # ---------------------------------------------------------------------------
  # MQTT
  # ---------------------------------------------------------------------------

  # Anonymous broker — no authentication required.
  mqtt:
    image: eclipse-mosquitto:2
    container_name: genx-mqtt
    ports:
      - "1883:1883"
    command:
      - sh
      - -c
      - |
        { echo 'listener 1883'; echo 'allow_anonymous true'; } > /tmp/m.conf
        mosquitto -c /tmp/m.conf
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Username / password broker (alice / secret).
  mqtt-auth:
    image: eclipse-mosquitto:2
    container_name: genx-mqtt-auth
    ports:
      - "1884:1883"
    command:
      - sh
      - -c
      - |
        mosquitto_passwd -c -b /tmp/passwd alice secret
        chown mosquitto:mosquitto /tmp/passwd && chmod 700 /tmp/passwd
        { echo 'listener 1883'; echo 'allow_anonymous false'; echo 'password_file /tmp/passwd'; } > /tmp/m.conf
        mosquitto -c /tmp/m.conf
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ping", "-u", "alice", "-P", "secret"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Subscribers — watch messages arriving in real time.
  # Usage: docker compose run --rm mqtt-sub
  mqtt-sub:
    image: eclipse-mosquitto:2
    profiles: [sub, test-mqtt]
    depends_on:
      mqtt:
        condition: service_healthy
    entrypoint: ["mosquitto_sub", "-h", "mqtt", "-t", "genx", "-v"]

  # Usage: docker compose run --rm mqtt-auth-sub
  mqtt-auth-sub:
    image: eclipse-mosquitto:2
    profiles: [sub, test-mqtt-auth]
    depends_on:
      mqtt-auth:
        condition: service_healthy
    entrypoint: ["mosquitto_sub", "-h", "mqtt-auth", "-t", "genx", "-v", "-u", "alice", "-P", "secret"]

  # Run: docker compose --profile test-mqtt up
  test-mqtt:
    build: .
    profiles: [test-mqtt]
    depends_on:
      mqtt:
        condition: service_healthy
    command: >
      --output mqtt
      --mqtt-broker tcp://mqtt:1883
      --type cos --duration 30s --step 5s --realtime

  # Run: docker compose --profile test-mqtt-auth up
  test-mqtt-auth:
    build: .
    profiles: [test-mqtt-auth]
    depends_on:
      mqtt-auth:
        condition: service_healthy
    command: >
      --output mqtt
      --mqtt-broker tcp://mqtt-auth:1883
      --mqtt-user alice
      --mqtt-password secret
      --type cos --duration 30s --step 5s --realtime

  # TLS broker — verifies client against the CA, no client cert required.
  mqtt-tls:
    image: eclipse-mosquitto:2
    container_name: genx-mqtt-tls
    ports:
      - "8883:8883"
    volumes:
      - ./certs:/certs:ro
    command:
      - sh
      - -c
      - |
        { echo 'listener 8883'
          echo 'allow_anonymous true'
          echo 'cafile /certs/ca.pem'
          echo 'certfile /certs/server.pem'
          echo 'keyfile /certs/server-key.pem'
          echo 'tls_version tlsv1.2'; } > /tmp/m.conf
        mosquitto -c /tmp/m.conf
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "8883",
             "--cafile", "/certs/ca.pem", "-t", "healthcheck", "-m", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  # mTLS broker — requires a valid client certificate signed by the CA.
  mqtt-mtls:
    image: eclipse-mosquitto:2
    container_name: genx-mqtt-mtls
    ports:
      - "8884:8883"
    volumes:
      - ./certs:/certs:ro
    command:
      - sh
      - -c
      - |
        { echo 'listener 8883'
          echo 'allow_anonymous true'
          echo 'cafile /certs/ca.pem'
          echo 'certfile /certs/server.pem'
          echo 'keyfile /certs/server-key.pem'
          echo 'require_certificate true'
          echo 'tls_version tlsv1.2'; } > /tmp/m.conf
        mosquitto -c /tmp/m.conf
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "8883",
             "--cafile", "/certs/ca.pem",
             "--cert", "/certs/sensor-0.pem", "--key", "/certs/sensor-0-key.pem",
             "-t", "healthcheck", "-m", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Usage: docker compose run --rm mqtt-tls-sub
  mqtt-tls-sub:
    image: eclipse-mosquitto:2
    profiles: [sub, test-mqtt-tls]
    depends_on:
      mqtt-tls:
        condition: service_healthy
    volumes:
      - ./certs:/certs:ro
    entrypoint: ["mosquitto_sub", "-h", "mqtt-tls", "-p", "8883",
                 "--cafile", "/certs/ca.pem", "-t", "genx", "-v"]

  # Usage: docker compose run --rm mqtt-mtls-sub
  mqtt-mtls-sub:
    image: eclipse-mosquitto:2
    profiles: [sub, test-mqtt-mtls]
    depends_on:
      mqtt-mtls:
        condition: service_healthy
    volumes:
      - ./certs:/certs:ro
    entrypoint: ["mosquitto_sub", "-h", "mqtt-mtls", "-p", "8883",
                 "--cafile", "/certs/ca.pem",
                 "--cert", "/certs/sensor-0.pem", "--key", "/certs/sensor-0-key.pem",
                 "-t", "genx", "-v"]

  # Run: docker compose --profile test-mqtt-tls up
  test-mqtt-tls:
    build: .
    profiles: [test-mqtt-tls]
    depends_on:
      mqtt-tls:
        condition: service_healthy
    volumes:
      - ./certs:/certs:ro
    command: >
      --output mqtt
      --mqtt-broker ssl://mqtt-tls:8883
      --mqtt-ca-cert /certs/ca.pem
      --type cos --duration 30s --step 5s --realtime

  # Run: docker compose --profile test-mqtt-mtls up
  test-mqtt-mtls:
    build: .
    profiles: [test-mqtt-mtls]
    depends_on:
      mqtt-mtls:
        condition: service_healthy
    volumes:
      - ./certs:/certs:ro
    command: >
      --output mqtt
      --mqtt-broker ssl://mqtt-mtls:8883
      --mqtt-ca-cert /certs/ca.pem
      --mqtt-cert /certs/sensor-0.pem
      --mqtt-key /certs/sensor-0-key.pem
      --type cos --duration 30s --step 5s --realtime

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------

  # Single-node Kafka in KRaft mode (no Zookeeper required).
  kafka:
    image: bitnami/kafka:latest
    container_name: genx-kafka
    profiles: [test-kafka]
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Console consumer — prints each message as it arrives.
  # Usage: docker compose run --rm kafka-sub
  kafka-sub:
    image: bitnami/kafka:latest
    profiles: [sub, test-kafka]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["kafka-console-consumer.sh", "--bootstrap-server", "kafka:9092",
                 "--topic", "genx", "--from-beginning"]

  # Run: docker compose --profile test-kafka up
  test-kafka:
    build: .
    profiles: [test-kafka]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # Advertise the internal broker address to containers on the same network.
      - KAFKA_BROKERS=kafka:9092
    command: >
      --output kafka
      --kafka-brokers kafka:9092
      --kafka-topic genx
      --type cos --duration 30s --step 5s --realtime

  # ---------------------------------------------------------------------------
  # NATS
  # ---------------------------------------------------------------------------

  # No authentication.
  nats:
    image: nats:2.10-alpine
    container_name: genx-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Username / password authentication (alice / secret).
  nats-userpass:
    image: nats:2.10-alpine
    container_name: genx-nats-userpass
    ports:
      - "4223:4222"
      - "8223:8222"
    command: ["--user", "alice", "--pass", "secret", "--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Token authentication.
  nats-token:
    image: nats:2.10-alpine
    container_name: genx-nats-token
    ports:
      - "4224:4222"
      - "8224:8222"
    command: ["--auth", "mysecrettoken", "--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Subscribers — watch messages arriving in real time.
  # Usage: docker compose run --rm nats-sub
  nats-sub:
    image: natsio/nats-box:latest
    profiles: [sub, test-nats]
    depends_on:
      nats:
        condition: service_healthy
    entrypoint: ["nats", "sub", "--server", "nats://nats:4222", "genx"]

  # Usage: docker compose run --rm nats-sub-userpass
  nats-sub-userpass:
    image: natsio/nats-box:latest
    profiles: [sub, test-nats-userpass]
    depends_on:
      nats-userpass:
        condition: service_healthy
    entrypoint: ["nats", "sub", "--server", "nats://alice:secret@nats-userpass:4222", "genx"]

  # Usage: docker compose run --rm nats-sub-token
  nats-sub-token:
    image: natsio/nats-box:latest
    profiles: [sub, test-nats-token]
    depends_on:
      nats-token:
        condition: service_healthy
    entrypoint: ["nats", "sub", "--server", "nats://mysecrettoken@nats-token:4222", "genx"]

  # Run: docker compose --profile test-nats up
  test-nats:
    build: .
    profiles: [test-nats]
    depends_on:
      nats:
        condition: service_healthy
    command: >
      --output nats
      --nats-url nats://nats:4222
      --type cos --duration 30s --step 5s --realtime

  # Run: docker compose --profile test-nats-userpass up
  test-nats-userpass:
    build: .
    profiles: [test-nats-userpass]
    depends_on:
      nats-userpass:
        condition: service_healthy
    command: >
      --output nats
      --nats-url nats://nats-userpass:4222
      --nats-user alice
      --nats-password secret
      --type cos --duration 30s --step 5s --realtime

  # Run: docker compose --profile test-nats-token up
  test-nats-token:
    build: .
    profiles: [test-nats-token]
    depends_on:
      nats-token:
        condition: service_healthy
    command: >
      --output nats
      --nats-url nats://nats-token:4222
      --nats-token mysecrettoken
      --type cos --duration 30s --step 5s --realtime

  # ---------------------------------------------------------------------------
  # OpenTelemetry
  # ---------------------------------------------------------------------------

  # OTel Collector — receives OTLP gRPC/HTTP, exposes a /metrics scrape endpoint.
  # Note: distroless image — no shell, no Docker health check possible.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: genx-otel-collector
    profiles: [test-otlp]
    volumes:
      - ./examples/otlp/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # Prometheus — scrapes the OTel Collector's /metrics and serves the PromQL API.
  prometheus:
    image: prom/prometheus:latest
    container_name: genx-prometheus
    profiles: [test-otlp]
    volumes:
      - ./examples/otlp/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Grafana — pre-configured with the Prometheus datasource and a genx dashboard.
  # Open http://localhost:3000 (no login required).
  grafana:
    image: grafana/grafana:latest
    container_name: genx-grafana
    profiles: [test-otlp]
    ports:
      - "3000:3000"
    volumes:
      - ./examples/otlp/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Run: docker compose --profile test-otlp up
  # genx sends a 3-device cosine fleet to the collector every 5 s.
  # Watch the live chart at http://localhost:3000
  test-otlp:
    build: .
    profiles: [test-otlp]
    depends_on:
      - otel-collector
    restart: on-failure
    command: >
      --output otlp
      --otlp-endpoint otel-collector:4317
      --otlp-insecure
      --type cos
      --devices 3
      --noise 0.05
      --duration 10m
      --step 5s
      --realtime

  # Run: docker compose --profile test-prometheus up
  # genx exposes /metrics; Prometheus scrapes it directly (no OTel Collector needed).
  # Watch the live chart at http://localhost:3000
  test-prometheus:
    build: .
    profiles: [test-prometheus]
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "9091:9091"
    command: >
      --output prometheus
      --prometheus-port 9091
      --type cos
      --devices 3
      --noise 0.05
      --duration 10m
      --step 5s
      --realtime
