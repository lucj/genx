services:

  # Webhook echo server — logs every incoming POST request with headers and body
  # Start: docker compose up webhook
  # Test with:
  #   docker run --rm --network host ghcr.io/lucj/genx \
  #     --output webhook --webhook-url http://localhost:8080 \
  #     --webhook-token mytoken --type cos --duration 1m --step 5s --realtime
  # View received payloads: docker compose logs -f webhook
  webhook:
    image: mendhak/http-https-echo:latest
    container_name: genx-webhook
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"

  # MQTT broker (anonymous, no authentication)
  # Start: docker compose up mqtt
  # Test with:
  #   docker run --rm --network host ghcr.io/lucj/genx \
  #     --output mqtt --mqtt-broker tcp://localhost:1883 --mqtt-topic genx \
  #     --type cos --duration 1m --step 5s --realtime
  mqtt:
    image: eclipse-mosquitto:2
    container_name: genx-mqtt
    ports:
      - "1883:1883"
    command: ["sh", "-c", "printf 'listener 1883\\nallow_anonymous true\\n' > /tmp/m.conf && mosquitto -c /tmp/m.conf"]

  # Optional subscriber — see MQTT messages arriving in real time
  # Usage: docker compose run --rm mqtt-sub
  mqtt-sub:
    image: eclipse-mosquitto:2
    profiles: ["sub"]
    depends_on: [mqtt]
    entrypoint: ["mosquitto_sub", "-h", "mqtt", "-t", "genx", "-v"]

  # NATS with user/password authentication
  # Test with:
  #   genx --output nats --nats-url nats://localhost:4222 \
  #         --nats-user alice --nats-password secret \
  #         --type cos --duration 1m --step 5s --realtime
  nats-userpass:
    image: nats:2.10-alpine
    container_name: genx-nats-userpass
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # HTTP monitoring  →  http://localhost:8222
    command: ["--user", "alice", "--pass", "secret", "--http_port", "8222"]

  # NATS with token authentication
  # Test with:
  #   genx --output nats --nats-url nats://localhost:4223 \
  #         --nats-token mysecrettoken \
  #         --type cos --duration 1m --step 5s --realtime
  nats-token:
    image: nats:2.10-alpine
    container_name: genx-nats-token
    ports:
      - "4223:4222"   # client connections
      - "8223:8222"   # HTTP monitoring  →  http://localhost:8223
    command: ["--auth", "mysecrettoken", "--http_port", "8222"]

  # Optional subscriber — see messages arriving in real time
  # Usage: docker compose run --rm nats-sub-userpass
  nats-sub-userpass:
    image: natsio/nats-box:latest
    profiles: ["sub"]
    depends_on: [nats-userpass]
    entrypoint: ["nats", "sub", "--server", "nats://alice:secret@nats-userpass:4222", "genx"]

  # Usage: docker compose run --rm nats-sub-token
  nats-sub-token:
    image: natsio/nats-box:latest
    profiles: ["sub"]
    depends_on: [nats-token]
    entrypoint: ["nats", "sub", "--server", "nats://mysecrettoken@nats-token:4222", "genx"]
