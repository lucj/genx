name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - test-webhook
          - test-cloudevent
          - test-mqtt
          - test-mqtt-auth
          - test-mqtt-tls
          - test-mqtt-mtls
          - test-nats
          - test-nats-userpass
          - test-nats-token
          - test-kafka
    steps:
      - uses: actions/checkout@v4

      - name: Run ${{ matrix.profile }}
        run: |
          docker compose --profile ${{ matrix.profile }} up \
            --build \
            --abort-on-container-exit \
            --exit-code-from ${{ matrix.profile }}

      - name: Teardown
        if: always()
        run: docker compose --profile ${{ matrix.profile }} down -v
