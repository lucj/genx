output: http-server
http-port: 8888
http-buffer: 10   # keep the last 10 points in memory

type: cos
min: 18
max: 26
period: 1h
step: 5s
device: sensor

# Add realtime: true to pace output to one point per step.
# Without it, all points are generated instantly and then the server keeps
# running until Ctrl-C, serving the buffered data.
