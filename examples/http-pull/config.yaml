output: http-server
http-port: 8888
http-buffer: 10   # keep the last 10 points in memory

type: cos
min: 18
max: 26
period: 1h
step: 5s
device: sensor

# realtime is enabled automatically when output is http-server so the buffer
# updates on each step. Set realtime: false explicitly to pre-generate all
# points instantly and then serve them from the buffer until Ctrl-C.
